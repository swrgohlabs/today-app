<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Today</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Today">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF7F2">
<style>
  :root {
    --bg: #FBF7F2; --card: #FFFFFF; --ink: #2B2622; --soft: #7A7068;
    --line: #EDE6DD; --accent: #D9734E; --accent-soft: #FBE9E1;
    --ok: #4F8A6E; --warn: #C2553A;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1D1A18; --card:#272320; --ink:#F2ECE6; --soft:#A79C92;
      --line:#38322D; --accent:#E8906E; --accent-soft:#3A2A23; --ok:#7DB89A; --warn:#EE8A70; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 40px); }
  header { margin-bottom: 18px; }
  .hello { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .date { color: var(--soft); margin: 2px 0 0; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft);
    margin: 0 0 8px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 9px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  li:first-child { border-top: 0; }
  .when { flex: 0 0 auto; min-width: 64px; font-size: 14px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .when.late { color: var(--warn); font-weight: 600; }
  .when.now { color: var(--accent); font-weight: 600; }
  .what { flex: 1; }
  .sub { display:block; font-size: 14px; color: var(--soft); }
  .empty { color: var(--soft); font-style: italic; padding: 4px 0; }
  .hero { background: var(--accent-soft); border-color: transparent; }
  .foot { text-align: center; color: var(--soft); font-size: 13px; margin-top: 18px; }
  button, .btn { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600; width: 100%; }
  .link { background: none; color: var(--soft); width: auto; padding: 6px; font-weight: 400;
    text-decoration: underline; font-size: 13px; }
  input { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); margin: 4px 0 12px; }
  label { font-size: 14px; color: var(--soft); }
  .msg { padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); margin-bottom: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<noscript><p style="padding:20px">Please turn on JavaScript to use Today.</p></noscript>
<main>
  <!-- Setup screen -->
  <div id="setup" hidden>
    <header>
      <p class="hello">Let's get you set up</p>
      <p class="date">This only happens once.</p>
    </header>
    <div id="setupMsg" class="msg" hidden></div>
    <section>
      <label for="repo">Your notebook</label>
      <input id="repo" placeholder="e.g. name/NotebookName" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label for="key">Your key</label>
      <input id="key" type="password" placeholder="Paste the key you were sent" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label for="name">Your name (optional)</label>
      <input id="name" placeholder="So the page can say hello" autocomplete="given-name">
      <button id="save">Save and open</button>
    </section>
    <p class="foot">Your key stays on this phone only.</p>
  </div>

  <!-- Dashboard -->
  <div id="dash" hidden>
    <header>
      <p class="hello" id="hello">Good morning</p>
      <p class="date" id="date"></p>
    </header>
    <div id="dashMsg" class="msg" hidden></div>

    <section class="hero">
      <h2>Today</h2>
      <ul id="today"></ul>
    </section>
    <section>
      <h2>Waiting on</h2>
      <ul id="waiting"></ul>
    </section>
    <section>
      <h2>Coming up</h2>
      <ul id="coming"></ul>
    </section>
    <section id="notesWrap">
      <h2>Notes</h2>
      <ul id="notes"></ul>
    </section>

    <p class="foot">
      <span id="updated"></span><br>
      <button class="link" id="refresh">Refresh</button>
      <button class="link" id="reset">Reconnect</button>
    </p>
  </div>
</main>

<script src="now-parser.js"></script>
<script src="app.js"></script>
</body>
</html>
